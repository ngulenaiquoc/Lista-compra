/* === ESTILOS MEJORADOS === */
* { box-sizing: border-box; }
body {

}

    background: rgba(255,255,255,0.9);

    z-index: 100;
}

}

    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    cursor: pointer;
}
#modo-compra { transform: scale(1.4); cursor: pointer; }
