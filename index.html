<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* === ESTILOS MEJORADOS === */
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom, #a8edea, #fed6e3);
    min-height: 100vh;
}
header {
    text-align: center;
    padding: 20px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 15px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
}
h1 { 
    margin: 0; 
    font-size: 2em; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 10px; 
}
.header-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
}
#modo-compra-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    cursor: pointer;
}
#modo-compra { transform: scale(1.4); cursor: pointer; }

/* CONTENEDOR MÁS ESTRECHO (DE 800PX A 550PX) */
#categories-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 15px;
    max-width: 550px;
    margin: 0 auto;
}
.category {
    border-radius: 15px;
    padding: 12px 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    color: #fff;
    transition: transform 0.2s;
}
.category:hover { transform: translateY(-2px); }
.category h2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 10px 0;
    cursor: pointer;
    user-select: none;
    font-size: 1.3em;
}
.category h2 .title { display: flex; align-items: center; gap: 10px; }
ul { 
    list-style: none; 
    padding: 0; 
    max-height: 300px; 
    overflow-y: auto; 
    margin: 0;
    transition: max-height 0.3s ease;
}
ul.collapsed { max-height: 0; overflow: hidden; }
li {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.95);
    margin-bottom: 5px;
    padding: 8px 12px;
    border-radius: 10px;
    gap: 10px;
    transition: all 0.2s;
    animation: slideIn 0.3s ease;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}
li:hover { background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
li label { 
    color: #000; 
    flex: 1;
    cursor: pointer;
    word-break: break-word;
}

li.checked label { 
    color: #888;
}

li input[type="checkbox"] { 
    transform: scale(1.3); 
    cursor: pointer;
    flex-shrink: 0;
}
li .item-actions {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
}
li .item-actions button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    font-size: 0.9em;
    transition: background 0.2s;
}
li .item-actions button:hover { background: rgba(0,0,0,0.1); }
li .item-actions .delete-btn:hover { background: #ffcdd2; color: #d32f2f; }
li .item-actions .edit-btn:hover { background: #bbdefb; color: #1976d2; }
.category-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
}
.add-button {
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    min-width: 120px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(5px);
}
.add-button:hover { background: rgba(255,255,255,0.4); transform: scale(1.02); }

.footer-controls {
    text-align: center;
    padding: 10px 15px 30px;
}

.clear-all-btn {
    background: #f44336;
    color: white;
    border: none;
    border-radius: 15px;
    padding: 12px 30px;
    font-weight: bold;
    cursor: pointer;
    margin: 0 auto;
    display: block;
    font-size: 1em;
    transition: all 0.2s;
}
.clear-all-btn:hover { 
    background: #d32f2f; 
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(244,67,54,0.4);
}
/* === COLORES POR CATEGORÍA === */
.category[data-cat="lacteos"] { background: linear-gradient(135deg, #FFA726, #FB8C00); }
.category[data-cat="carnes"] { background: linear-gradient(135deg, #EF5350, #C62828); }
.category[data-cat="bebidas"] { background: linear-gradient(135deg, #29B6F6, #0277BD); }
.category[data-cat="frutas-verduras"] { background: linear-gradient(135deg, #66BB6A, #2E7D32); }
.category[data-cat="envasados"] { background: linear-gradient(135deg, #AB47BC, #6A1B9A); }
.category[data-cat="higiene"] { background: linear-gradient(135deg, #FFCA28, #F9A825); color: #333; }

/* === RESPONSIVE === */
@media (max-width: 600px) {
    h1 { font-size: 1.5em; }
    #categories-container { padding: 10px; }
    .category { padding: 12px; }
    li { padding: 8px; flex-wrap: wrap; }
    li .item-actions { margin-left: auto; }
    .category-actions { flex-direction: column; }
    .add-button { min-width: unset; }
    .header-controls { flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>

<header>
    <h1>🛒 Lista de la compra</h1>
    <div class="header-controls">
        <label id="modo-compra-label">
            <input type="checkbox" id="modo-compra"> Modo compra
        </label>
    </div>
</header>

<div id="categories-container"></div>

<div class="footer-controls">
    <button class="clear-all-btn" id="clear-all-btn" onclick="clearAll()">🗑️ Limpiar toda la lista</button>
</div>

<script>
const categories_template = {
    "lacteos": ["🥣 Natillas","🍶 Yogures","🍫 Mousse","🧀 Queso","🧀 Queso lonchas","🧀 Mozarela","🧀 Roquefort","☕ Chocolate","🧃 Batidos","🥛 Nata cocinar","🥛 Leche","🥛 Leche vaporizada","🥛 Leche condensada","🍦 Helados"],
    "carnes": ["🌭 Salchichas","🍖 Carne","🥩 Lomo","🍗 Pollo","🍝 Gulas","🦑 Calamares","🦐 Gambas","🥓 Bacon","🌭 Chorizo","🍖 Jamón York","🍖 Jamón serrano","🌭 Txistorra"],
    "bebidas": ["🥤 Coca cola Sin cafeína","🧃 Aquarius naranja","🥤 Coca cola","💧 Agua"],
    "frutas-verduras": ["🍅 Tomates","🥣 Crema de verduras","🍌 Plátanos","🍎 Fresa","🍊 Naranjas","🍒 Cerezas","🍑 Melocotón","🍄 Setas","🥜 Frutos secos"],
    "envasados": ["🌱 Lentejas","🐟 Atún","🥚 Huevos","🥗 Ensalada","🥞 Crepes","🥖 Fingers","🍞 Pan molde","🥟 Masa buitone","🥖 Tequeños"],
    "higiene": ["🧴 Desodorante","🚿 Gel de ducha","🧼 Jabón de manos","📜 Papel aluminio","🦷 Hilo dental","🧻 Servilletas","🧻 Papel de cocina","🧻 Papel higiénico","💆‍♀️ Discos desmaquillantes","🚽 Desinfectante inodoro"]
};

const container = document.getElementById("categories-container");
const modoCompra = document.getElementById("modo-compra");
const clearAllBtn = document.getElementById("clear-all-btn");

function getItems(cat) {
    try {
        return JSON.parse(localStorage.getItem(cat) || "[]");
    } catch { return []; }
}

function setItems(cat, items) {
    localStorage.setItem(cat, JSON.stringify(items));
}

function loadCategories() {
    container.innerHTML = "";

    for (const cat in categories_template) {
        let stored = getItems(cat);
        
        // Si no se ha inicializado nunca, cargamos la plantilla
        if (stored.length === 0 && !localStorage.getItem(`init_${cat}`)) {
            stored = categories_template[cat].map(label => ({ label, checked: false }));
            setItems(cat, stored);
            localStorage.setItem(`init_${cat}`, "true");
        }

        const div = document.createElement("div");
        div.className = "category";
        div.dataset.cat = cat;

        div.innerHTML = `
            <h2 onclick="toggleCategory('${cat}')">
                <span class="title">
                    <span>📌</span>
                    ${cat.charAt(0).toUpperCase() + cat.slice(1)}
                </span>
                <span>▼</span>
            </h2>
            <ul id="${cat}"></ul>
            <div class="category-actions">
                <button class="add-button" onclick="addItem('${cat}')">➕ Añadir</button>
            </div>
        `;
        container.appendChild(div);

        const ul = div.querySelector("ul");
        stored.forEach(item => {
            const li = createItemElement(cat, item);
            ul.appendChild(li);
        });
    }

    toggleSections();
}

function createItemElement(cat, item) {
    const li = document.createElement("li");
    if (item.checked) li.classList.add("checked");
    
    li.innerHTML = `
        <input type="checkbox" ${item.checked ? 'checked' : ''}>
        <label>${item.label}</label>
        <div class="item-actions">
            <button class="edit-btn" title="Editar">✏️</button>
            <button class="delete-btn" title="Eliminar">🗑️</button>
        </div>
    `;

    const checkbox = li.querySelector("input");
    checkbox.addEventListener("change", () => {
        toggleItem(cat, item.label, checkbox.checked);
        li.classList.toggle("checked", checkbox.checked);
    });

    const editBtn = li.querySelector(".edit-btn");
    editBtn.addEventListener("click", () => editItem(cat, item.label));
    li.querySelector("label").addEventListener("dblclick", () => editItem(cat, item.label));

    const deleteBtn = li.querySelector(".delete-btn");
    deleteBtn.addEventListener("click", () => deleteItem(cat, item.label));

    return li;
}

function toggleItem(cat, label, checked) {
    let items = getItems(cat);
    const idx = items.findIndex(i => i.label === label);
    if (idx >= 0) {
        items[idx].checked = checked;
        setItems(cat, items);
    }
}

function deleteItem(cat, label) {
    if (!confirm(`¿Eliminar "${label}" de ${cat}?`)) return;
    let items = getItems(cat).filter(i => i.label !== label);
    setItems(cat, items);
    loadCategories();
}

function editItem(cat, oldLabel) {
    const newLabel = prompt(`Editar "${oldLabel}"`, oldLabel);
    if (!newLabel || newLabel === oldLabel) return;
    let items = getItems(cat);
    const idx = items.findIndex(i => i.label === oldLabel);
    if (idx >= 0) {
        items[idx].label = newLabel;
        setItems(cat, items);
        loadCategories();
    }
}

// FUNCIÓN MODIFICADA PARA GUARDAR ELEMENTOS PERMANENTES
function addItem(cat) {
    const name = prompt("Introduce el nombre del nuevo elemento:");
    if (!name || name.trim() === "") return;
    const items = getItems(cat);
    
    if (items.some(i => i.label.toLowerCase() === name.trim().toLowerCase())) {
        alert(`"${name}" ya existe en ${cat}`);
        return;
    }
    
    items.push({ label: name.trim(), checked: false });
    setItems(cat, items);
    loadCategories();

    const ul = document.getElementById(cat);
    if (ul) ul.scrollTop = ul.scrollHeight;
}

function clearAll() {
    if (!confirm("⚠️ ¿Eliminar TODA la lista de compras?")) return;
    for (const cat in categories_template) {
        setItems(cat, []);
    }
    loadCategories();
}

function toggleCategory(cat) {
    const ul = document.getElementById(cat);
    if (ul) ul.classList.toggle("collapsed");
}

function toggleSections() {
    const isModoCompra = modoCompra.checked;
    document.querySelectorAll(".category ul").forEach(ul => {
        ul.querySelectorAll("li").forEach(li => {
            const checkbox = li.querySelector("input");
            li.style.display = (isModoCompra && !checkbox.checked) ? "none" : "flex";
        });
    });
    
    document.querySelectorAll(".add-button").forEach(btn => {
        btn.style.display = isModoCompra ? "none" : "inline-block";
    });
    clearAllBtn.style.display = isModoCompra ? "none" : "block";
}

// Inicialización
document.addEventListener("DOMContentLoaded", () => {
    modoCompra.checked = localStorage.getItem("modo-compra") === "true";
    modoCompra.addEventListener("change", () => {
        localStorage.setItem("modo-compra", modoCompra.checked);
        toggleSections();
    });
    loadCategories();
});

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.log("SW error:", err));
    });
}
</script>
</body>
</html>
